# omen15-fan configuration.
# Installed by default at /etc/omen15-fan/config.toml.
#
# This register map was CONFIRMED BY LIVE TESTING on an HP Omen 15-en1003ur
# (board 88D2) on 2026-10-28: writing control_enable_value (6) to 0x62 and a
# target value to 0x34/0x35 made the fans audibly respond. This is the
# older, widely-used HP Omen EC layout (same family of registers as the
# long-standing `omen-fan`/`hp-omen-linux-module` projects), not the newer
# scheme `pankha` documents for 88D2 (0x15/0x19), which tested as INERT on
# this exact unit. See docs/CALIBRATION.md for the full story — other 88D2
# firmware revisions may still need a different map, always sanity check
# with `omen15-fan calibrate` on a new machine before trusting `curve`.

ec_path = "/sys/kernel/debug/ec/ec0/io"

# hwmon chip to read CPU temperature from. "auto" prefers k10temp (your
# Ryzen CPU), falling back to the first hwmon chip found.
hwmon_chip = "auto"

# Hard ceiling. omen15-fan will never command a speed above this, no
# matter what the curve or a manual `set` call says.
max_rpm = 5500
# Floor speed while temperature is below the first curve point.
idle_rpm = 2000

poll_interval_ms = 2000
# Fan speed is only allowed to step back down once the temperature has
# dropped this many degrees below the level that produced the last step up.
hysteresis_c = 3.0

[registers]
# 0 = BIOS/auto. Writing control_enable_value below switches to manual.
control = 0x62
control_enable_value = 6
# EC watchdog: omen15-fan resets this to 0 every poll while it's driving
# the fan. If this tool crashes without cleaning up, the firmware itself
# hands control back to the BIOS once this counts down — a free safety net.
countdown = 0x63

fan1_target = 0x34   # CPU fan, write target, units of 100 RPM
fan1_read = 0x2E      # best-effort telemetry; see fan1_read_encoding
fan1_read_encoding = "period_raw"  # not yet calibrated to exact RPM, shown raw

fan2_target = 0x35   # GPU fan
fan2_read = 0x2F
fan2_read_encoding = "period_raw"

# --- Alternate map, reported (not confirmed on en1003ur) for OTHER 88D2
# firmware revisions by the `pankha` project. Only switch to this if
# `calibrate` shows the block above doing nothing on your machine:
# control = 0x15
# control_enable_value = 1
# countdown = <none, remove the `countdown` line above>
# fan1_target = 0x19
# fan1_read = 0x11
# fan1_read_encoding = "rpm100"
# fan2_target = <none>
# fan2_read = <none>

[[curve]]
temp_c = 40.0
speed_percent = 0

[[curve]]
temp_c = 55.0
speed_percent = 35

[[curve]]
temp_c = 65.0
speed_percent = 55

[[curve]]
temp_c = 75.0
speed_percent = 75

[[curve]]
temp_c = 85.0
speed_percent = 90

[[curve]]
temp_c = 92.0
speed_percent = 100
